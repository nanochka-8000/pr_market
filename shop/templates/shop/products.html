{% extends 'shop/base.html' %}

{% block title %}{{ title }} — My market{% endblock %}

{% block content %}
    <h1 class="page-title">{{ title }}</h1>

    <div class="categories-nav">
        <a href="{% url 'products_view' %}" class="categories-nav__link {% if not current_category %}categories-nav__link--active{% endif %}">Все</a>
        {% for cat in categories %}
            <a href="{% url 'category_products_view' category_slug=cat.slug %}" class="categories-nav__link {% if current_category and current_category.pk == cat.pk %}categories-nav__link--active{% endif %}">{{ cat.name }}</a>
        {% endfor %}
    </div>

    <form method="get" class="search-form">
        {{ search_form.q }}
        <button type="submit" class="btn btn--primary">Найти</button>
    </form>

    <div class="products-grid">
        {% include 'shop/_product_list.html' %}
    </div>

    {% include 'shop/_pagination.html' %}
{% endblock %}
